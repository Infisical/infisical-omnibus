name: Build and release packages

on:
    workflow_dispatch:
    push:
        # run only against tags
        tags:
            - "v*.*.*"
            - "v*.*.*-nightly-*"
            - "v*.*.*-nightly-*.*"

jobs:
    build-debian-package:
        name: Build debian amd package
        runs-on: ubuntu-latest-64-cores
        steps:
            - name: Checkout source
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0
            - name: Build the debian package
              run: make pkg-deb
            - name: Copy the pkg from source to local
              run: |
                  container_id=$(docker create infisical-omnibus-debian-builder)
                  docker cp "$container_id":/omnibus-project/pkg ./pkg
            - name: Upload debian packages as artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: debian-packages
                  path: pkg/*.deb
                  retention-days: 1

    build-rpm-package:
        name: Build rpm amd package
        runs-on: ubuntu-latest-64-cores
        steps:
            - name: Checkout source
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0
            - name: Build the rpm package
              run: make pkg-rpm
            - name: Copy the pkg from source to local
              run: |
                  container_id=$(docker create infisical-omnibus-rpm-builder)
                  docker cp "$container_id":/omnibus-project/pkg ./pkg
            - name: Upload rpm packages as artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: rpm-packages
                  path: pkg/*.rpm
                  retention-days: 1

    release-packages:
        name: Release packages to repositories
        needs:
            - build-debian-package
            - build-rpm-package
        runs-on: ubuntu-latest-16-cores
        outputs:
            deb_version: ${{ steps.published-versions.outputs.deb_version }}
            rpm_version: ${{ steps.published-versions.outputs.rpm_version }}
        steps:
            - name: Checkout source
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0
            - name: Download debian packages
              uses: actions/download-artifact@v4
              with:
                  name: debian-packages
                  path: pkg
            - name: Download rpm packages
              uses: actions/download-artifact@v4
              with:
                  name: rpm-packages
                  path: pkg
            - uses: actions/setup-python@v4
              with:
                  python-version: "3.12"
            - uses: ruby/setup-ruby@354a1ad156761f5ee2b7b13fa8e09943a5e8d252
              with:
                  ruby-version: "3.3"
                  bundler-cache: true
            - name: Install deb-s3
              run: gem install deb-s3

            - name: Install RPM signing tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y rpm

            - name: Install repogen
              run: |
                  curl -L https://github.com/ralt/repogen/releases/latest/download/repogen-linux-amd64 -o repogen
                  chmod +x repogen
                  sudo mv repogen /usr/local/bin/

            - name: Install AWS CLI
              run: |
                  pip install awscli

            - name: Configure GPG Key
              run: echo -n "$GPG_SIGNING_KEY" | base64 --decode | gpg --batch --import
              env:
                  GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
                  GPG_SIGNING_KEY_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}

            - name: Publish packages to repositories
              run: sh upload_to_s3.sh
              env:
                  INFISICAL_BINARY_S3_BUCKET: ${{ secrets.INFISICAL_BINARY_S3_BUCKET }}
                  GPG_SIGNING_KEY_ID: ${{ secrets.GPG_SIGNING_KEY_ID }}
                  GPG_SIGNING_KEY_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}
                  AWS_ACCESS_KEY_ID: ${{ secrets.INFISICAL_BINARY_REPO_AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.INFISICAL_BINARY_REPO_AWS_SECRET_ACCESS_KEY }}
                  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.INFISICAL_BINARY_REPO_CLOUDFRONT_DISTRIBUTION_ID }}

            - name: Record published package versions
              id: published-versions
              run: |
                  set -euo pipefail

                  # upload_to_s3.sh has already renamed the rpm, so read whatever is in pkg/ now.
                  debs=(pkg/*.deb)
                  rpms=(pkg/*.rpm)
                  if [ "${#debs[@]}" -ne 1 ] || [ "${#rpms[@]}" -ne 1 ]; then
                      echo "::error::Expected exactly one .deb and one .rpm in pkg/, found: ${debs[*]} ${rpms[*]}"
                      exit 1
                  fi

                  deb_version=$(dpkg-deb -f "${debs[0]}" Version)
                  rpm_version=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "${rpms[0]}")
                  if [ -z "$deb_version" ] || [ -z "$rpm_version" ]; then
                      echo "::error::Could not read package versions (deb='$deb_version', rpm='$rpm_version')"
                      exit 1
                  fi

                  echo "Published deb version: $deb_version"
                  echo "Published rpm version: $rpm_version"
                  echo "deb_version=$deb_version" >> "$GITHUB_OUTPUT"
                  echo "rpm_version=$rpm_version" >> "$GITHUB_OUTPUT"

    create-github-release:
        name: Create GitHub Release
        needs:
            - build-debian-package
            - build-rpm-package
            - release-packages
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout source
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - name: Download debian packages
              uses: actions/download-artifact@v4
              with:
                  name: debian-packages
                  path: pkg

            - name: Download rpm packages
              uses: actions/download-artifact@v4
              with:
                  name: rpm-packages
                  path: pkg

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: pkg/*
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    invalidate-cloudfront-cache:
        name: Invalidate Cloudfront cache
        needs:
            - release-packages
        runs-on: ubuntu-latest-64-cores
        steps:
            - uses: actions/setup-python@v4
              with:
                  python-version: "3.12"
            - name: Install AWS CLI
              run: |
                  pip install awscli
            - name: Invalidate Cloudfront cache
              run: |
                  set -euo pipefail

                  INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/rpm/Packages/*" "/rpm/repodata/*" "/deb/dists/stable/*" --query 'Invalidation.Id' --output text)
                  echo "Created invalidation $INVALIDATION_ID"

                  # verify-published-repos must not run until edges stop serving the previous indexes.
                  aws cloudfront wait invalidation-completed --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --id "$INVALIDATION_ID"
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.INFISICAL_BINARY_REPO_AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.INFISICAL_BINARY_REPO_AWS_SECRET_ACCESS_KEY }}
                  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.INFISICAL_BINARY_REPO_CLOUDFRONT_DISTRIBUTION_ID }}

    verify-published-repos:
        name: Verify published repo (${{ matrix.image }})
        needs:
            - release-packages
            - invalidate-cloudfront-cache
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - family: deb
                      image: debian:12
                      version_output: deb_version
                    - family: deb
                      image: ubuntu:24.04
                      version_output: deb_version
                    - family: rpm
                      image: amazonlinux:2023
                      version_output: rpm_version
                    - family: rpm
                      image: rockylinux:9
                      version_output: rpm_version
        env:
            REPO_URL: https://artifacts-infisical-core.infisical.com
            IMAGE: ${{ matrix.image }}
            EXPECTED_VERSION: ${{ needs.release-packages.outputs[matrix.version_output] }}
        steps:
            # Packages are ~300 MB and their postinst needs a real host, so they are never installed or
            # downloaded in full: pool files are checked against the index size, rpms by their signed header.
            - name: Write deb verification script
              if: matrix.family == 'deb'
              run: |
                  set -euo pipefail

                  cat > "$RUNNER_TEMP/verify.sh" <<'EOF'
                  set -euo pipefail
                  export DEBIAN_FRONTEND=noninteractive
                  fail() { echo "FAIL: $*" >&2; exit 1; }
                  content_length() { curl -fsSI --retry 3 --retry-all-errors "$1" | tr -d '\r' | awk 'tolower($1) == "content-length:" { n = $2 } END { print n }'; }

                  apt-get update -qq
                  apt-get install -y -qq curl ca-certificates > /dev/null
                  curl -fsSL -o /tmp/setup.deb.sh "$REPO_URL/setup.deb.sh" || fail "could not fetch $REPO_URL/setup.deb.sh"
                  bash /tmp/setup.deb.sh || fail "setup.deb.sh failed: apt-get rejected the repo indexes (see its output above)"

                  keyring=/usr/share/keyrings/infisical-core-archive-keyring.gpg
                  sources=/etc/apt/sources.list.d/infisical-core.list
                  grep -q "signed-by=$keyring" "$sources" || fail "$sources does not pin signed-by=$keyring"
                  if grep -q 'trusted=yes' "$sources"; then fail "$sources disables signature checks"; fi

                  # apt silently falls back to Release when InRelease is missing, so check all three.
                  dists="$REPO_URL/deb/dists/stable"
                  work=$(mktemp -d)
                  for f in InRelease Release Release.gpg; do
                      curl -fsS -o "$work/$f" "$dists/$f" || fail "could not fetch $dists/$f"
                  done
                  gpgv --keyring "$keyring" "$work/Release.gpg" "$work/Release" || fail "Release.gpg does not verify Release"
                  gpgv --keyring "$keyring" --output "$work/InRelease.txt" "$work/InRelease" || fail "InRelease signature does not verify"
                  # Clearsigning does not cover trailing whitespace (deb-s3 writes "Suite: "), so compare without it.
                  cmp -s <(sed 's/[[:space:]]*$//' "$work/InRelease.txt") <(sed 's/[[:space:]]*$//' "$work/Release") \
                      || fail "InRelease and Release differ (one of them is stale)"

                  apt-get update --error-on=any || fail "apt-get update reported errors"

                  indexes=$(apt-get indextargets --format '$(FILENAME)' 'Created-By: Packages' | grep 'artifacts-infisical-core' || true)
                  [ -n "$indexes" ] || fail "no Packages index found for $REPO_URL"
                  for i in $indexes; do /usr/lib/apt/apt-helper cat-file "$i"; done \
                      | awk '/^Package:/ { p = $2 } /^Version:/ { v = $2 } /^Filename:/ { f = $2 } /^Size:/ { s = $2 }
                             /^$/ { if (f) print p, v, f, s; p = v = f = s = "" } END { if (f) print p, v, f, s }' \
                      | sort -u > "$work/entries"
                  entry=$(awk -v v="$EXPECTED_VERSION" '$1 == "infisical-core" && $2 == v { print $3, $4; exit }' "$work/entries")
                  [ -n "$entry" ] || fail "infisical-core $EXPECTED_VERSION is not listed in Packages"
                  read -r path size <<< "$entry"

                  actual=$(content_length "$REPO_URL/deb/$path" || true)
                  [ "$actual" = "$size" ] || fail "$path has index size $size, pool size ${actual:-missing}"

                  echo "OK: infisical-core $EXPECTED_VERSION is published and matches its Packages entry"
                  EOF

            - name: Write rpm verification script
              if: matrix.family == 'rpm'
              run: |
                  set -euo pipefail

                  cat > "$RUNNER_TEMP/verify.sh" <<'EOF'
                  set -euo pipefail
                  fail() { echo "FAIL: $*" >&2; exit 1; }
                  content_length() { curl -fsSI --retry 3 --retry-all-errors "$1" | tr -d '\r' | awk 'tolower($1) == "content-length:" { n = $2 } END { print n }'; }

                  curl -fsSL -o /tmp/setup.rpm.sh "$REPO_URL/setup.rpm.sh" || fail "could not fetch $REPO_URL/setup.rpm.sh"
                  bash /tmp/setup.rpm.sh || fail "setup.rpm.sh failed: dnf rejected the repo indexes (see its output above)"

                  repo=/etc/yum.repos.d/infisical-core.repo
                  grep -qx 'gpgcheck=1' "$repo" || fail "$repo does not set gpgcheck=1"
                  grep -qx 'repo_gpgcheck=1' "$repo" || fail "$repo does not set repo_gpgcheck=1"

                  # repo_gpgcheck=1 makes dnf reject a missing or bad repomd.xml.asc when it loads the metadata here.
                  entry=$(dnf repoquery -q --repo infisical-core --qf '%{location} %{downloadsize}' "infisical-core-$EXPECTED_VERSION") \
                      || fail "dnf could not load the repodata"
                  [ -n "$entry" ] || fail "infisical-core-$EXPECTED_VERSION is not listed in repodata"
                  read -r location size <<< "$entry"

                  # rpm stops reading after the header (~20 MB), which carries the version and the signature.
                  key=$(rpm -q gpg-pubkey --qf '%{VERSION} %{PACKAGER}\n' | awk 'tolower($0) ~ /infisical/ { print $1 }')
                  [ -n "$key" ] || fail "the Infisical signing key was not imported by setup.rpm.sh"
                  header=$(set +o pipefail; curl -sS "$REPO_URL/rpm/$location" 2> /dev/null \
                      | rpm -qp --qf '%{VERSION}-%{RELEASE}|%{RSAHEADER:pgpsig}' - 2> /tmp/rpm.err || true)
                  [ ! -s /tmp/rpm.err ] || fail "rpm/$location header does not verify: $(cat /tmp/rpm.err)"
                  [ "${header%%|*}" = "$EXPECTED_VERSION" ] || fail "rpm/$location is ${header%%|*}, expected $EXPECTED_VERSION"
                  case "${header#*|}" in
                      *"Key ID "*"$key") ;;
                      *) fail "rpm/$location is not signed with the Infisical key $key: ${header#*|}" ;;
                  esac

                  actual=$(content_length "$REPO_URL/rpm/$location" || true)
                  [ "$actual" = "$size" ] || fail "rpm/$location has repodata size $size, served size ${actual:-missing}"

                  echo "OK: infisical-core $EXPECTED_VERSION is published and matches its repodata entry"
                  EOF

            # Retries cover CloudFront edges that have not all picked up the invalidation yet.
            - name: Download infisical-core ${{ env.EXPECTED_VERSION }} in a clean ${{ matrix.image }} container
              run: |
                  set -euo pipefail

                  if [ -z "$EXPECTED_VERSION" ]; then
                      echo "::error::No expected version was passed from release-packages"
                      exit 1
                  fi

                  attempts=5
                  for attempt in $(seq 1 "$attempts"); do
                      echo "Attempt $attempt/$attempts"
                      if docker run --rm -i --platform linux/amd64 -e REPO_URL -e EXPECTED_VERSION "$IMAGE" bash -s < "$RUNNER_TEMP/verify.sh"; then
                          exit 0
                      fi
                      if [ "$attempt" -lt "$attempts" ]; then
                          delay=$((attempt * 30))
                          echo "Attempt $attempt failed, retrying in ${delay}s"
                          sleep "$delay"
                      fi
                  done

                  echo "::error::$REPO_URL does not serve a valid infisical-core $EXPECTED_VERSION for $IMAGE after $attempts attempts"
                  exit 1

    notify-pipeline-blocked:
        name: Notify incident.io if pipeline blocked
        runs-on: ubuntu-latest
        needs:
            - build-debian-package
            - build-rpm-package
            - release-packages
            - create-github-release
            - invalidate-cloudfront-cache
            - verify-published-repos
        if: always() && contains(needs.*.result, 'failure')
        steps:
            - name: Send blocked alert to incident.io
              env:
                  ALERT_URL: ${{ secrets.INCIDENT_IO_DEPLOY_ALERT_URL }}
                  ALERT_TOKEN: ${{ secrets.INCIDENT_IO_DEPLOY_ALERT_TOKEN }}
                  NEEDS_JSON: ${{ toJSON(needs) }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  IMAGE_TAG: ${{ github.ref_name }}
                  ACTOR: ${{ github.actor }}
                  RUN_ID: ${{ github.run_id }}
              run: |
                  set -euo pipefail

                  # Guard against a misconfigured/rotated secret redirecting the POST (and the
                  # bearer token) to an unintended host: only allow the incident.io API origin.
                  case "$ALERT_URL" in
                    https://api.incident.io/*) ;;
                    *)
                      echo "::error::ALERT_URL does not point at https://api.incident.io/ — refusing to send alert."
                      exit 1
                      ;;
                  esac

                  FAILED=$(echo "$NEEDS_JSON" | jq -r 'to_entries | map(select(.value.result == "failure") | .key) | join(", ")')
                  BLOCKED=$(echo "$NEEDS_JSON" | jq -r 'to_entries | map(select(.value.result == "cancelled" or .value.result == "skipped") | .key) | join(", ")')
                  jq -n \
                    --arg title "[${{ github.repository }}] Build and release pipeline blocked" \
                    --arg failed "${FAILED:-unknown}" \
                    --arg blocked "${BLOCKED:-none}" \
                    --arg dedup "release-${RUN_ID}" \
                    --arg url "$RUN_URL" \
                    --arg tag "${IMAGE_TAG:-unknown}" \
                    --arg actor "$ACTOR" \
                    '{
                      title: $title,
                      description: ("Failed stage(s): " + $failed + "."),
                      deduplication_key: $dedup,
                      status: "firing",
                      source_url: $url,
                      metadata: { failed_stages: $failed, blocked_stages: $blocked, image_tag: $tag, actor: $actor }
                    }' \
                  | curl -sS --fail-with-body --connect-timeout 10 --max-time 30 -X POST "$ALERT_URL" \
                      -H "Authorization: Bearer $ALERT_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d @-
